name: CUDA runtime and artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cuda-runtime:
    name: Linux NVIDIA runtime
    runs-on: [self-hosted, linux, x64, nvidia]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build CUDA MCP artifact
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features cuda --bin biturbo-mcp
      - name: Runtime smoke test
        env:
          BITURBO_EMBED_EP: cuda
        run: cargo test --manifest-path src-tauri/Cargo.toml --features cuda embed::tests -- --nocapture
      - name: Package CUDA MCP binary
        run: tar -C src-tauri/target/release -czf biturbo-mcp-linux-x64-cuda.tar.gz biturbo-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: biturbo-mcp-linux-x64-cuda
          path: biturbo-mcp-linux-x64-cuda.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: biturbo-mcp-linux-x64-cuda.tar.gz
